<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CarPlay 車用移動 KTV 旗艦系統</title>
    <!-- 第三方核心函式庫：PeerJS (端對端通訊)、QRCode.js (配對條碼) -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #0b0c10; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            overflow: hidden;
            user-select: none;
        }
        .hidden { display: none !important; }

        /* ================= 1. 車機大螢幕端 UI ================= */
        #screen-view { display: flex; height: 100vh; width: 100vw; position: relative; }
        
        #video-container { 
            flex: 1; 
            position: relative; 
            background: #000; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
        }
        #player { width: 100%; height: 100%; pointer-events: none; }
        
        /* HUD 即時狀態列（左上角） */
        #hud-overlay { 
            position: absolute; 
            top: 24px; 
            left: 24px; 
            background: rgba(15, 16, 22, 0.85); 
            padding: 12px 20px; 
            border-radius: 14px; 
            font-size: 14px; 
            pointer-events: none; 
            border-left: 4px solid #00ffcc;
            backdrop-filter: blur(10px);
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        /* 錢櫃風格雙行 KTV 懸浮歌詞層 */
        #lyrics-container {
            position: absolute;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1100px;
            background: linear-gradient(180deg, rgba(12, 14, 20, 0.45) 0%, rgba(12, 14, 20, 0.88) 100%);
            border-radius: 24px;
            padding: 24px 36px;
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .ktv-line {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: 2px;
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 經典上行：靠左對齊，預留右側空間 */
        #lyric-top { text-align: left; padding-right: 15%; }
        /* 經典下行：靠右對齊，預留左側空間 */
        #lyric-bottom { text-align: right; padding-left: 15%; }

        /* 預覽等待角色色彩（暗淡微光，供歌手預覽） */
        .ktv-line.role-male    { color: rgba(56, 189, 248, 0.35); }
        .ktv-line.role-female  { color: rgba(244, 114, 182, 0.35); }
        .ktv-line.role-duet    { color: rgba(250, 204, 21, 0.35); }
        .ktv-line.role-default { color: rgba(148, 163, 184, 0.35); }

        /* 當前演唱句：放大 + 霓虹輝光 */
        .ktv-line.active {
            font-size: 38px;
            font-weight: 900;
            transform: scale(1.02);
        }
        .ktv-line.role-male.active {
            color: #38bdf8;
            text-shadow: 0 0 16px rgba(56, 189, 248, 0.8), 0 0 35px rgba(56, 189, 248, 0.4);
        }
        .ktv-line.role-female.active {
            color: #f472b6;
            text-shadow: 0 0 16px rgba(244, 114, 182, 0.8), 0 0 35px rgba(244, 114, 182, 0.4);
        }
        .ktv-line.role-duet.active {
            color: #facc15;
            text-shadow: 0 0 16px rgba(250, 204, 21, 0.8), 0 0 35px rgba(250, 204, 21, 0.4);
        }
        .ktv-line.role-default.active {
            color: #00ffcc;
            text-shadow: 0 0 16px rgba(0, 255, 204, 0.8), 0 0 35px rgba(0, 255, 204, 0.4);
        }

        /* 側邊主機欄（右側） */
        #sidebar { 
            width: 330px; 
            background: #141622; 
            padding: 24px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            border-left: 1px solid #23273a;
            z-index: 20;
        }
        #qrcode-box { 
            background: #fff; 
            padding: 12px; 
            border-radius: 14px; 
            margin: 16px 0; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .hud-stat { font-size: 13px; color: #8e95ad; margin-bottom: 6px; }
        .hud-stat span { color: #fff; font-weight: bold; }

        /* ================= 2. 手機遙控器端 UI ================= */
        #remote-view { 
            padding: 18px 16px; 
            max-width: 480px; 
            margin: 0 auto; 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            overflow-y: auto;
            height: 100vh;
            user-select: auto;
        }
        .card { 
            background: #151824; 
            border: 1px solid #24293e; 
            border-radius: 16px; 
            padding: 16px; 
        }
        .card-title { 
            font-size: 13px; 
            text-transform: uppercase; 
            color: #717894; 
            margin-bottom: 12px; 
            font-weight: 700; 
            letter-spacing: 0.8px; 
        }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { 
            background: #252a3d; 
            color: #fff; 
            border: none; 
            padding: 14px; 
            border-radius: 12px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.1s; 
            text-align: center; 
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: #ff0055; color: #fff; }
        .btn-accent { background: #00ffcc; color: #0b0c10; font-weight: 700; }
        
        .control-group { margin-top: 10px; }
        .control-label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
        input[type="range"] { width: 100%; height: 8px; border-radius: 4px; background: #252a3d; accent-color: #00ffcc; }
        input[type="text"] { 
            width: 100%; 
            padding: 12px 14px; 
            background: #0b0c10; 
            border: 1px solid #252a3d; 
            border-radius: 10px; 
            color: #fff; 
            font-size: 14px; 
            margin-bottom: 8px;
        }
        input[type="text"]:focus { border-color: #00ffcc; outline: none; }
    </style>
</head>
<body>

    <!-- ================= 車機大螢幕介面 ================= -->
    <div id="screen-view">
        <div id="video-container">
            <div id="player"></div>
            
            <div id="hud-overlay">
                <div>模式：<span id="hud-mode" style="color: #00ffcc;">原唱模式</span></div>
                <div style="margin-top: 4px; font-size: 12px; color: #a0a6be;">
                    音量：<span id="hud-vol" style="color:#fff;">80%</span> ｜ 迴音：<span id="hud-echo" style="color:#fff;">0.3</span>
                </div>
            </div>

            <!-- 雙行交替 KTV 歌詞容器 -->
            <div id="lyrics-container">
                <div id="lyric-top" class="ktv-line">🎵 準備歡唱...</div>
                <div id="lyric-bottom" class="ktv-line"></div>
            </div>
        </div>

        <div id="sidebar">
            <div style="text-align: center; width: 100%;">
                <h2 style="font-size: 18px; margin-bottom: 4px;">車用 KTV 智慧主機</h2>
                <p style="font-size: 12px; color: #717894;">副駕與後座請掃碼連線點歌</p>
                <div id="qrcode-box" style="display: flex; justify-content: center;"></div>
                <div class="hud-stat">房號：<span id="room-id-display">建立中...</span></div>
                <div class="hud-stat">連線裝置：<span id="remote-status" style="color: #ffaa00;">等待掃碼中 ⏳</span></div>
            </div>
            <button class="btn btn-accent" style="width: 100%;" onclick="enableAudioMixer()">🎤 啟用車載麥克風＋迴音</button>
        </div>
    </div>

    <!-- ================= 手機遙控器介面 ================= -->
    <div id="remote-view" class="hidden">
        <div class="card">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <span class="card-title" style="margin-bottom: 0;">點播身分</span>
                <input type="text" id="user-nickname" value="副駕乘客" style="width: 120px; padding: 6px 10px; font-size: 13px; text-align: right; margin-bottom: 0;">
            </div>
            <div id="mobile-status-text" style="color: #00ffcc; font-size: 13px; margin-top: 8px;">正在連接車機螢幕...</div>
        </div>

        <!-- 模式一：智慧搜尋點歌卡片 -->
        <div class="card">
            <div class="card-title">🔍 歌名 / 歌手 智慧搜尋點歌</div>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="search-keyword" placeholder="輸入歌名 (例如: 告白氣球)" style="margin-bottom: 0;">
                <button class="btn btn-accent" style="width: 80px; padding: 12px;" onclick="searchYouTubeKTV()">搜尋</button>
            </div>
            <div id="search-results-box" style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px;"></div>
        </div>

        <!-- 模式二：手動貼上網址 / Video ID 點歌卡片 -->
        <div class="card">
            <div class="card-title">🔗 手動輸入網址 / Video ID 點歌</div>
            <input type="text" id="manual-title" placeholder="歌曲名稱 (例: 晴天，用於抓取同步歌詞)">
            <input type="text" id="manual-artist" placeholder="演唱歌手 (選填，例: 周杰倫)">
            <input type="text" id="manual-orig-id" placeholder="原唱 YouTube 完整網址或 11 碼 ID">
            <input type="text" id="manual-inst-id" placeholder="伴奏版 YouTube 網址或 ID (選填)">
            <div class="btn-grid" style="margin-top: 4px;">
                <button class="btn btn-accent" onclick="submitManualSong(false)">＋加入待播</button>
                <button class="btn btn-primary" onclick="submitManualSong(true)">⚡優先插播</button>
            </div>
        </div>

        <!-- 即時演唱控制 -->
        <div class="card">
            <div class="card-title">即時演唱控制</div>
            <div class="btn-grid">
                <button class="btn btn-primary" onclick="sendCmd({ action: 'PLAY_PAUSE' })">⏯ 播放 / 暫停</button>
                <button class="btn btn-accent" id="btn-toggle-vocal" onclick="toggleVocalTrack()">🎙 切換伴奏</button>
            </div>
            <button class="btn" style="width: 100%; margin-top: 10px; background: #393e5a;" onclick="sendCmd({ action: 'SKIP_SONG' })">
                ⏭️ 切歌（跳至下一首）
            </button>
        </div>

        <!-- 待播清單 -->
        <div class="card">
            <div class="card-title" style="display: flex; justify-content: space-between;">
                <span>📋 待播清單</span>
                <span id="queue-count" style="color: #00ffcc;">0 首</span>
            </div>
            <div id="now-playing-box" style="font-size: 13px; color: #a0a6be; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px dashed #2a304a;">
                現正播放：<span id="now-playing-title" style="color: #fff; font-weight: bold;">無</span>
            </div>
            <div id="queue-list-box" style="display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto;">
                <div style="font-size: 13px; color: #5a617a; text-align: center; padding: 10px;">目前尚無排隊歌曲</div>
            </div>
        </div>

        <!-- 音效與音量微調 -->
        <div class="card">
            <div class="card-title">混音音效設定</div>
            <div class="control-group">
                <div class="control-label">
                    <span>音樂音量</span>
                    <span id="lbl-vol">80%</span>
                </div>
                <input type="range" min="0" max="100" value="80" oninput="updateVol(this.value)">
            </div>
            <div class="control-group" style="margin-top: 14px;">
                <div class="control-label">
                    <span>麥克風迴音 (Echo 延遲)</span>
                    <span id="lbl-echo">0.3</span>
                </div>
                <input type="range" min="0" max="0.7" step="0.05" value="0.3" oninput="updateEcho(this.value)">
            </div>
        </div>
    </div>

    <!-- 載入 YouTube 官方 IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // ================= 1. 金鑰配置與環境參數 =================
        // 請將此處替換為你在 Google Cloud 申請的 YouTube Data API v3 金鑰
        const YT_API_KEY = "你的_API_KEY_填在這裡";

        const urlParams = new URLSearchParams(window.location.search);
        const isRemote = urlParams.get('role') === 'remote';
        const targetRoom = urlParams.get('room');

        let peer, remoteClients = [], connToScreen = null;
        let ytPlayer;
        let audioCtx, micDelayNode, micFeedbackGain;

        // 當前歌曲與隊列狀態
        let currentSong = null;
        let songQueue = [];
        let currentOriginalId = 'd_43a4H70qU'; // 預設示範曲 ID
        let currentInstId = 'nE8v6e7qJ6A';
        let isInstrumental = false;
        let parsedLyrics = [];
        let activeLyricIndex = -1;

        // ================= 2. 路由分流 =================
        if (isRemote) {
            document.getElementById('screen-view').classList.add('hidden');
            document.getElementById('remote-view').classList.remove('hidden');
            initRemoteMode(targetRoom);
        } else {
            initScreenMode();
        }

        // ================= 3. 車機大螢幕端邏輯 (Screen Mode) =================
        function initScreenMode() {
            const roomId = 'ktv-' + Math.floor(1000 + Math.random() * 9000);
            peer = new Peer(roomId);

            peer.on('open', (id) => {
                document.getElementById('room-id-display').innerText = id;
                const remoteUrl = window.location.origin + window.location.pathname + `?role=remote&room=${id}`;
                new QRCode(document.getElementById("qrcode-box"), {
                    text: remoteUrl,
                    width: 140,
                    height: 140
                });
            });

            // 支援多人掃碼連線池
            peer.on('connection', (c) => {
                c.on('open', () => {
                    remoteClients.push(c);
                    updateConnectedCountUI();
                    
                    // 新裝置連入時，立即發送當前播放狀態與排隊歌單
                    c.send({
                        action: 'SYNC_QUEUE',
                        currentSong: currentSong,
                        queue: songQueue
                    });
                });

                c.on('data', (data) => {
                    handleRemoteCommand(data);
                });

                c.on('close', () => {
                    remoteClients = remoteClients.filter(client => client !== c);
                    updateConnectedCountUI();
                });

                c.on('error', () => {
                    remoteClients = remoteClients.filter(client => client !== c);
                    updateConnectedCountUI();
                });
            });

            // 預載示範曲的歌詞
            fetchSyncedLyrics("十年", "陳奕迅");

            // 啟動高頻計時器 (每 80ms 同步秒數並切換雙行歌詞)
            setInterval(syncLyricsScroll, 80);
        }

        // 廣播最新排隊資料給全車手機
        function broadcastQueueToRemote() {
            remoteClients = remoteClients.filter(client => client && client.open);
            remoteClients.forEach(client => {
                try {
                    client.send({
                        action: 'SYNC_QUEUE',
                        currentSong: currentSong,
                        queue: songQueue
                    });
                } catch (e) {}
            });
            updateConnectedCountUI();
        }

        function updateConnectedCountUI() {
            const statusEl = document.getElementById('remote-status');
            if (!statusEl) return;
            if (remoteClients.length > 0) {
                statusEl.innerText = `已連線：${remoteClients.length} 台裝置 ✅`;
                statusEl.style.color = '#00ffcc';
            } else {
                statusEl.innerText = '等待掃碼中 ⏳';
                statusEl.style.color = '#ffaa00';
            }
        }

        // 自動播放下一首
        function playNextSong() {
            if (songQueue.length > 0) {
                currentSong = songQueue.shift();
                currentOriginalId = currentSong.origId;
                currentInstId = currentSong.instId || currentSong.origId;
                isInstrumental = false;

                document.getElementById('hud-mode').innerText = "原唱模式";
                ytPlayer.loadVideoById(currentOriginalId);
                
                if (currentSong.title) {
                    fetchSyncedLyrics(currentSong.title, currentSong.artist);
                }
            } else {
                currentSong = null;
                const elTop = document.getElementById('lyric-top');
                const elBottom = document.getElementById('lyric-bottom');
                if (elTop && elBottom) {
                    elTop.innerText = '🎵 待播歌單已唱完，請使用手機點歌！';
                    elTop.className = 'ktv-line active';
                    elBottom.innerText = '';
                    elBottom.className = 'ktv-line';
                }
            }
            broadcastQueueToRemote();
        }

        // 執行來自手機的各項遙控指令
        function handleRemoteCommand(cmd) {
            if (!ytPlayer) return;

            switch (cmd.action) {
                case 'PLAY_PAUSE':
                    const state = ytPlayer.getPlayerState();
                    state === YT.PlayerState.PLAYING ? ytPlayer.pauseVideo() : ytPlayer.playVideo();
                    break;

                case 'SWITCH_TRACK':
                    const currentSec = ytPlayer.getCurrentTime();
                    isInstrumental = cmd.isInstrumental;
                    const targetId = isInstrumental ? currentInstId : currentOriginalId;
                    
                    ytPlayer.loadVideoById({
                        videoId: targetId,
                        startSeconds: currentSec
                    });
                    document.getElementById('hud-mode').innerText = isInstrumental ? "伴奏模式" : "原唱模式";
                    break;

                case 'SET_VOLUME':
                    ytPlayer.setVolume(cmd.value);
                    document.getElementById('hud-vol').innerText = `${cmd.value}%`;
                    break;

                case 'SET_ECHO':
                    if (micFeedbackGain && audioCtx) {
                        micFeedbackGain.gain.setValueAtTime(cmd.value, audioCtx.currentTime);
                    }
                    document.getElementById('hud-echo').innerText = cmd.value;
                    break;

                case 'ADD_TO_QUEUE':
                    songQueue.push(cmd.song);
                    if (!currentSong && ytPlayer.getPlayerState() !== YT.PlayerState.PLAYING) {
                        playNextSong();
                    } else {
                        broadcastQueueToRemote();
                    }
                    break;

                case 'INSERT_NEXT':
                    songQueue.unshift(cmd.song);
                    if (!currentSong && ytPlayer.getPlayerState() !== YT.PlayerState.PLAYING) {
                        playNextSong();
                    } else {
                        broadcastQueueToRemote();
                    }
                    break;

                case 'SKIP_SONG':
                    playNextSong();
                    break;

                case 'REMOVE_FROM_QUEUE':
                    songQueue.splice(cmd.index, 1);
                    broadcastQueueToRemote();
                    break;
            }
        }

        // ================= 4. 男女合唱動態時間軸解析 (LRCLIB) =================
        function detectSingerRole(rawText) {
            const maleRegex = /^(?:\(|（|\[)?(?:男|M|Boy|Male)(?:\)|）|\]|：|:)\s*/i;
            const femaleRegex = /^(?:\(|（|\[)?(?:女|F|Girl|Female)(?:\)|）|\]|：|:)\s*/i;
            const duetRegex = /^(?:\(|（|\[)?(?:合|合唱|男女|All|Duet|Both)(?:\)|）|\]|：|:)\s*/i;

            if (maleRegex.test(rawText)) return { role: 'male', text: rawText.replace(maleRegex, ''), tag: '👨 男' };
            if (femaleRegex.test(rawText)) return { role: 'female', text: rawText.replace(femaleRegex, ''), tag: '👩 女' };
            if (duetRegex.test(rawText)) return { role: 'duet', text: rawText.replace(duetRegex, ''), tag: '👫 合' };
            return { role: 'default', text: rawText, tag: '' };
        }

        async function fetchSyncedLyrics(title, artist) {
            parsedLyrics = [];
            activeLyricIndex = -1;
            
            const elTop = document.getElementById('lyric-top');
            const elBottom = document.getElementById('lyric-bottom');
            if (elTop && elBottom) {
                elTop.innerText = '🔍 正在檢索時間軸歌詞...';
                elTop.className = 'ktv-line active';
                elBottom.innerText = '';
                elBottom.className = 'ktv-line';
            }

            try {
                const query = encodeURIComponent(`${title} ${artist || ''}`);
                const response = await fetch(`https://lrclib.net/api/search?q=${query}`);
                const results = await response.json();

                const matched = results.find(item => item.syncedLyrics);
                if (matched && matched.syncedLyrics) {
                    parseLRC(matched.syncedLyrics);
                    applyLineState(elTop, parsedLyrics[0], false);
                    applyLineState(elBottom, parsedLyrics[1], false);
                } else {
                    elTop.innerText = '🎵 此曲無同步動態歌詞，請欣賞畫面字幕';
                    elTop.className = 'ktv-line active';
                    elBottom.innerText = '';
                }
            } catch (err) {
                elTop.innerText = '⚠️ 歌詞獲取失敗，請確認聯網狀態';
                elBottom.innerText = '';
            }
        }

        function parseLRC(lrcContent) {
            parsedLyrics = [];
            const lines = lrcContent.split('\n');
            const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;

            lines.forEach((line) => {
                const match = line.match(timeReg);
                if (match) {
                    const min = parseInt(match[1]);
                    const sec = parseInt(match[2]);
                    const ms = parseFloat("0." + match[3]);
                    const totalSec = min * 60 + sec + ms;
                    const rawText = match[4].trim();

                    if (rawText) {
                        const parsed = detectSingerRole(rawText);
                        parsedLyrics.push({ 
                            time: totalSec, 
                            text: parsed.text, 
                            role: parsed.role,
                            tag: parsed.tag 
                        });
                    }
                }
            });
        }

        // 雙行交替渲染核心
        function syncLyricsScroll() {
            if (!ytPlayer || !ytPlayer.getCurrentTime || parsedLyrics.length === 0) return;

            const curTime = ytPlayer.getCurrentTime();
            let matchedIdx = -1;

            for (let i = 0; i < parsedLyrics.length; i++) {
                if (curTime >= parsedLyrics[i].time) {
                    matchedIdx = i;
                } else {
                    break;
                }
            }

            const elTop = document.getElementById('lyric-top');
            const elBottom = document.getElementById('lyric-bottom');
            if (!elTop || !elBottom) return;

            if (matchedIdx === -1) {
                applyLineState(elTop, parsedLyrics[0], false);
                applyLineState(elBottom, parsedLyrics[1], false);
                activeLyricIndex = -1;
                return;
            }

            if (matchedIdx !== activeLyricIndex) {
                activeLyricIndex = matchedIdx;
                const currentSongLine = parsedLyrics[matchedIdx];
                const nextSongLine = parsedLyrics[matchedIdx + 1] || null;

                if (matchedIdx % 2 === 0) {
                    applyLineState(elTop, currentSongLine, true);
                    applyLineState(elBottom, nextSongLine, false);
                } else {
                    applyLineState(elBottom, currentSongLine, true);
                    applyLineState(elTop, nextSongLine, false);
                }
            }
        }

        function applyLineState(el, lineData, isActive) {
            if (!lineData) {
                el.innerText = '';
                el.className = 'ktv-line';
                return;
            }
            const prefix = lineData.tag ? `[${lineData.tag}] ` : '';
            el.innerText = `${prefix}${lineData.text}`;
            el.className = `ktv-line role-${lineData.role} ${isActive ? 'active' : ''}`;
        }

        // ================= 5. 手機遙控端邏輯 (Remote Mode) =================
        function initRemoteMode(roomId) {
            peer = new Peer();
            peer.on('open', () => {
                connToScreen = peer.connect(roomId);
                connToScreen.on('open', () => {
                    document.getElementById('mobile-status-text').innerText = `已連接包廂：${roomId} ✅`;
                });
                connToScreen.on('data', (data) => {
                    if (data.action === 'SYNC_QUEUE') {
                        renderQueueUI(data.currentSong, data.queue);
                    }
                });
            });
        }

        function sendCmd(obj) {
            if (connToScreen && connToScreen.open) {
                connToScreen.send(obj);
            }
        }

        function toggleVocalTrack() {
            isInstrumental = !isInstrumental;
            const btn = document.getElementById('btn-toggle-vocal');
            btn.innerText = isInstrumental ? "🎤 切換原唱" : "🎙 切換伴奏";
            btn.className = isInstrumental ? "btn btn-primary" : "btn btn-accent";
            sendCmd({ action: 'SWITCH_TRACK', isInstrumental: isInstrumental });
        }

        function updateVol(val) {
            document.getElementById('lbl-vol').innerText = `${val}%`;
            sendCmd({ action: 'SET_VOLUME', value: parseInt(val) });
        }

        function updateEcho(val) {
            document.getElementById('lbl-echo').innerText = val;
            sendCmd({ action: 'SET_ECHO', value: parseFloat(val) });
        }

        // 網址正則解析工具函式：支援完整 YouTube 網址、youtu.be 或純 11 碼 ID
        function extractVideoId(str) {
            if (!str) return '';
            const match = str.match(/(?:youtu\.be\/|watch\?v=|\/embed\/|\/v\/|^)([a-zA-Z0-9_-]{11})/);
            return match ? match[1] : str.trim();
        }

        // 智慧搜尋 YouTube
        async function searchYouTubeKTV() {
            const keyword = document.getElementById('search-keyword').value.trim();
            const resultsBox = document.getElementById('search-results-box');

            if (!keyword) return alert("請先輸入想唱的歌名！");
            if (YT_API_KEY === "你的_API_KEY_填在這裡") {
                return alert("請先在程式碼中的 YT_API_KEY 填入 Google Cloud 申請的金鑰！");
            }

            resultsBox.innerHTML = '<div style="color: #00ffcc; font-size: 13px; text-align: center; padding: 8px;">🔍 正在搜尋 YouTube 原唱與伴奏版本...</div>';

            try {
                const origQueryUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(keyword)}&type=video&maxResults=3&key=${YT_API_KEY}`;
                const instQueryUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(keyword + " KTV 伴奏")}&type=video&maxResults=1&key=${YT_API_KEY}`;

                const [origResponse, instResponse] = await Promise.all([
                    fetch(origQueryUrl).then(res => res.json()),
                    fetch(instQueryUrl).then(res => res.json())
                ]);

                resultsBox.innerHTML = '';
                if (!origResponse.items || origResponse.items.length === 0) {
                    resultsBox.innerHTML = '<div style="color: #ff4444; font-size: 13px; text-align: center;">找不到相關影片，請更換關鍵字。</div>';
                    return;
                }

                const matchedInstId = (instResponse.items && instResponse.items.length > 0)
                    ? instResponse.items[0].id.videoId
                    : '';

                origResponse.items.forEach(item => {
                    const videoId = item.id.videoId;
                    const title = item.snippet.title;
                    const channel = item.snippet.channelTitle;
                    const thumbnail = item.snippet.thumbnails.default.url;

                    const songData = {
                        title: keyword,
                        artist: channel,
                        origId: videoId,
                        instId: matchedInstId || videoId,
                        displayTitle: title
                    };

                    const card = document.createElement('div');
                    card.style = "display: flex; align-items: center; gap: 10px; background: #1c2033; padding: 10px; border-radius: 10px; border: 1px solid #2a304a;";
                    card.innerHTML = `
                        <img src="${thumbnail}" style="width: 60px; height: 45px; border-radius: 6px; object-fit: cover;">
                        <div style="flex: 1; overflow: hidden;">
                            <div style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff;">${title}</div>
                            <div style="font-size: 11px; color: #8e95ad; margin-top: 2px;">${channel}</div>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <button class="btn btn-accent" style="padding: 6px 10px; font-size: 11px;" onclick='queueSong(${JSON.stringify(songData)}, false)'>＋點歌</button>
                            <button class="btn btn-primary" style="padding: 6px 10px; font-size: 11px;" onclick='queueSong(${JSON.stringify(songData)}, true)'>⚡插播</button>
                        </div>
                    `;
                    resultsBox.appendChild(card);
                });
            } catch (err) {
                resultsBox.innerHTML = '<div style="color: #ff4444; font-size: 13px; text-align: center;">搜尋失敗，請檢查 API Key 或網路連線。</div>';
            }
        }

        // 手動輸入網址 / Video ID 點歌處理函式
        function submitManualSong(isInsertNext) {
            const rawTitle = document.getElementById('manual-title').value.trim();
            const rawArtist = document.getElementById('manual-artist').value.trim();
            const rawOrig = document.getElementById('manual-orig-id').value.trim();
            const rawInst = document.getElementById('manual-inst-id').value.trim();

            const origId = extractVideoId(rawOrig);
            const instId = extractVideoId(rawInst) || origId;

            if (!origId) {
                alert("請填入原唱的 YouTube 網址或 11 碼 Video ID！");
                return;
            }

            const songTitle = rawTitle || '自訂點播曲目';
            const displayTitle = rawTitle ? (rawArtist ? `${rawTitle} - ${rawArtist}` : rawTitle) : `自訂影片 (${origId})`;

            const songData = {
                title: songTitle,
                artist: rawArtist,
                origId: origId,
                instId: instId,
                displayTitle: displayTitle
            };

            queueSong(songData, isInsertNext);

            // 清空輸入框
            document.getElementById('manual-title').value = '';
            document.getElementById('manual-artist').value = '';
            document.getElementById('manual-orig-id').value = '';
            document.getElementById('manual-inst-id').value = '';
        }

        function queueSong(song, isInsertNext) {
            const nickname = document.getElementById('user-nickname').value.trim() || '車上乘客';
            song.requestedBy = nickname;

            if (isInsertNext) {
                sendCmd({ action: 'INSERT_NEXT', song: song });
                alert(`已優先插播：《${song.displayTitle}》`);
            } else {
                sendCmd({ action: 'ADD_TO_QUEUE', song: song });
                alert(`已加入待播清單：《${song.displayTitle}》`);
            }
        }

        function renderQueueUI(current, queue) {
            document.getElementById('now-playing-title').innerText = current ? `${current.displayTitle || current.title}` : '無';
            document.getElementById('queue-count').innerText = `${queue.length} 首`;

            const listBox = document.getElementById('queue-list-box');
            listBox.innerHTML = '';

            if (queue.length === 0) {
                listBox.innerHTML = '<div style="font-size: 13px; color: #5a617a; text-align: center; padding: 10px;">目前尚無排隊歌曲</div>';
                return;
            }

            queue.forEach((item, idx) => {
                const row = document.createElement('div');
                row.style = "display: flex; align-items: center; justify-content: space-between; background: #1c2033; padding: 8px 12px; border-radius: 8px; font-size: 13px;";
                row.innerHTML = `
                    <div style="flex: 1; overflow: hidden; margin-right: 8px;">
                        <span style="color: #00ffcc; font-weight: bold; margin-right: 6px;">${idx + 1}.</span>
                        <span style="color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${item.displayTitle || item.title}</span>
                        <span style="display: inline-block; font-size: 10px; background: #282f47; color: #a5b4fc; padding: 2px 6px; border-radius: 4px; margin-left: 6px;">
                            ${item.requestedBy || '乘客'}
                        </span>
                    </div>
                    <button style="background: none; border: 1px solid #ff4444; color: #ff4444; border-radius: 4px; padding: 2px 6px; font-size: 11px; cursor: pointer;" onclick="sendCmd({ action: 'REMOVE_FROM_QUEUE', index: ${idx} })">刪除</button>
                `;
                listBox.appendChild(row);
            });
        }

        // ================= 6. YouTube Player 實例化 =================
        function onYouTubeIframeAPIReady() {
            if (isRemote) return;
            ytPlayer = new YT.Player('player', {
                videoId: currentOriginalId,
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'modestbranding': 1,
                    'rel': 0,
                    'playsinline': 1
                },
                events: {
                    'onReady': (e) => e.target.playVideo(),
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.ENDED) {
                            playNextSong();
                        }
                    }
                }
            });
        }

        // ================= 7. Web Audio API 車載麥克風迴音混音 =================
        async function enableAudioMixer() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                const micStream = await navigator.mediaDevices.getUserMedia({
                    audio: { 
                        echoCancellation: false, 
                        noiseSuppression: false, 
                        autoGainControl: false,
                        latency: 0.01
                    }
                });

                const micSource = audioCtx.createMediaStreamSource(micStream);
                micDelayNode = audioCtx.createDelay();
                micDelayNode.delayTime.value = 0.18;

                micFeedbackGain = audioCtx.createGain();
                micFeedbackGain.gain.value = 0.3;

                micSource.connect(audioCtx.destination);
                micSource.connect(micDelayNode);
                micDelayNode.connect(micFeedbackGain);
                micFeedbackGain.connect(micDelayNode);
                micDelayNode.connect(audioCtx.destination);

                alert("車載麥克風混音與迴音引擎已成功啟動！");
            } catch (err) {
                alert("麥克風存取失敗：請確認已接上麥克風設備，且連線為 HTTPS。");
            }
        }
    </script>
